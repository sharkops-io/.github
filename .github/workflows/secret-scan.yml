# Reusable: gitleaks over the FULL history, with the two extra rules carried
# over from GitLab (sharkops/gitlab-ci-common-config security/secret-scan.yml
# and example-org/gitlab-k8s-agent base.yaml).
#
# Runs the gitleaks image directly rather than gitleaks-action, which needs a
# paid license key for organization repos.
#
# Callers:  jobs: { secret-scan: { uses: sharkops-io/.github/.github/workflows/secret-scan.yml@main } }
name: secret-scan

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A shallow clone scans only the newest commits and passes while
          # older history carries a secret.
          fetch-depth: 0

      - name: Write the extended ruleset
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'EOF'
          [extend]
          useDefault = true

          # Lowercase hex scores below generic-api-key's entropy threshold, so a
          # 32-hex *arr API key was never reported (TAUTULLI_API_KEY, 2026-08-07).
          [[rules]]
          id = "hex-credential-assignment"
          description = "Credential-named field assigned a 32-64 char hex value"
          regex = '''(?i)(?:api[-_]?key|apikey|api[-_]?token|auth[-_]?token|access[-_]?token|token|secret|password|passwd)["']?\s*[:=]\s*["']?([0-9a-fA-F]{32,64})["']?'''
          secretGroup = 1
          keywords = ["apikey","api_key","api-key","apitoken","api_token","token","secret","password","passwd"]

          # env: - name: X_TOKEN / value: <secret>: the credential keyword is on
          # the line ABOVE the value, which the default rules never see.
          [[rules]]
          id = "yaml-name-value-credential"
          description = "Credential-named YAML key whose value is on the NEXT line"
          regex = '''(?i)name:\s*["']?[a-z0-9_.-]*(?:token|secret|passwd|password|api[-_]?key|credential)[a-z0-9_.-]*["']?\s*\n\s*-?\s*value:\s*["']?([^\s"'{$][^\s"']{15,})["']?'''
          secretGroup = 1
          keywords = ["token","secret","password","passwd","apikey","api_key","api-key","credential"]

          [rules.allowlist]
          regexes = ['''(?i)^[{]''', '''(?i)^[$]''', '''(?i)(redacted|masked|changeme|example|placeholder|dummy|xxxx)''']
          EOF

      - name: gitleaks
        # --redact: a finding is otherwise reprinted into the public job log.
        # --user: the checkout belongs to the runner user; running as root
        # trips git's "dubious ownership" check and the scan sees no commits.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -v "$RUNNER_TEMP/gitleaks.toml:/gitleaks.toml:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --config /gitleaks.toml --redact --no-banner
