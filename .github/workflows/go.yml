# Reusable: golangci-lint + go test -race, ported from
# sharkops/gitlab-ci-common-config go/ci.yml (same pinned versions).
#
# Callers:  jobs: { go: { uses: sharkops-io/.github/.github/workflows/go.yml@main } }
name: go

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.27"
      golangci-lint-version:
        type: string
        default: "v2.13.1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: golangci-lint
        # The official image, as on GitLab, so the linter version is the pin
        # above and not whatever an action resolves.
        env:
          LINT_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            "golangci/golangci-lint:${LINT_VERSION}" \
            golangci-lint run --timeout 5m

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
      - run: go test ./... -race -count=1
